[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raglab"
version = "0.1.0"
description = "A local-first, inspectable RAG ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py>=3.0,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
raglab-ingest = "raglab.cli:entrypoint"
raglab-retrieve = "raglab.retrieval.cli:entrypoint"
raglab-generate = "raglab.generation.cli:entrypoint"

[project.optional-dependencies]
conversion = ["docling>=2,<3", "easyocr>=1.7,<2"]
tokenizers = ["transformers>=4.51,<5"]
retrieval = ["transformers>=4.51,<5", "torch>=2.5,<3"]
dev = [
  "mypy>=1.15,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"raglab.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires optional conversion dependencies or PostgreSQL",
  "e2e: requires Docling, Ollama, and PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["raglab"]

[[tool.mypy.overrides]]
module = ["docling.*", "transformers.*"]
ignore_missing_imports = true
