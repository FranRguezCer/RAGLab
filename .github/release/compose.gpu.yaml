services:
  postgres:
    image: paradedb/paradedb:0.25.0-pg17
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: release-only
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raglab -d raglab"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.11.4
    gpus: all
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-models:
    image: ollama/ollama:0.11.4
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ollama pull qwen3-embedding:0.6b && ollama pull qwen3:4b
    depends_on:
      ollama:
        condition: service_healthy

  python-models:
    image: ${RAGLAB_IMAGE:?Set RAGLAB_IMAGE to an immutable image reference}
    user: "0:0"
    environment:
      HF_HOME: /models
    volumes:
      - huggingface:/models
    entrypoint: ["python", "-c"]
    command:
      - >-
        from huggingface_hub import snapshot_download;
        snapshot_download('tasksource/deberta-small-long-nli', revision='9a77395d4d3751be9e2a69c4ae318491d9b3fffb');
        snapshot_download('BAAI/bge-reranker-v2-m3', revision='953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e')

  ingest:
    image: ${RAGLAB_IMAGE:?Set RAGLAB_IMAGE to an immutable image reference}
    command:
      - raglab-ingest-corpus
      - data/demo/raspberry_pi_v1.json
      - --receipt
      - artifacts/ingestion.json
    environment: &raglab
      RAGLAB_BUILD_SHA: ${RAGLAB_BUILD_SHA:?Set RAGLAB_BUILD_SHA}
      RAGLAB_IMAGE_DIGEST: ${RAGLAB_IMAGE_DIGEST:?Set RAGLAB_IMAGE_DIGEST}
      RAGLAB_DSN: postgresql://raglab:release-only@postgres:5432/raglab
      RAGLAB_OLLAMA_BASE_URL: http://ollama:11434
      HF_HOME: /models
    volumes: &raglab-volumes
      - ${RELEASE_ARTIFACTS_DIR:?Set RELEASE_ARTIFACTS_DIR}:/app/artifacts
      - huggingface:/models
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  evaluate:
    image: ${RAGLAB_IMAGE:?Set RAGLAB_IMAGE to an immutable image reference}
    command:
      - raglab-evaluate
      - data/evaluation/raspberry_pi_demo_v1.json
      - --collection
      - rpi-computers
      - --output
      - artifacts/evaluation.json
    environment: *raglab
    volumes: *raglab-volumes
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  gate:
    image: ${RAGLAB_IMAGE:?Set RAGLAB_IMAGE to an immutable image reference}
    command:
      - raglab-evaluation-gate
      - artifacts/evaluation.json
      - data/evaluation/baselines/raspberry_pi_demo_v1.json
    volumes:
      - ${RELEASE_ARTIFACTS_DIR:?Set RELEASE_ARTIFACTS_DIR}:/app/artifacts

  models-manifest:
    image: ${RAGLAB_IMAGE:?Set RAGLAB_IMAGE to an immutable image reference}
    command: ["python", "/release/resolve_models.py", "/app/artifacts/models.json"]
    environment:
      RAGLAB_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./resolve_models.py:/release/resolve_models.py:ro
      - ${RELEASE_ARTIFACTS_DIR:?Set RELEASE_ARTIFACTS_DIR}:/app/artifacts
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres:
  ollama:
  huggingface:
