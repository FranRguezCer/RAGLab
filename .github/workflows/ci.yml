name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[dev,generation,retrieval,tokenizers]'

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src/raglab

      - name: Run hermetic tests
        run: pytest --cov=raglab --cov-fail-under=85 -m 'not integration and not e2e'

      - name: Validate Compose definitions
        run: docker compose -f compose.yaml config --quiet

      - name: Build runtime image
        run: docker build --tag raglab:test .
