name: Release verified portfolio demo

on:
  workflow_dispatch:
    inputs:
      build_sha:
        description: Full commit SHA from a successful CI run on main
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUNTIME_IMAGE: ghcr.io/franrguezcer/raglab
  PORTFOLIO_IMAGE: ghcr.io/franrguezcer/raglab-portfolio

jobs:
  authorize:
    name: Verify trusted build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      build_sha: ${{ steps.verify-input.outputs.build_sha }}
      runtime_ref: ${{ steps.resolve.outputs.runtime_ref }}
      runtime_digest: ${{ steps.resolve.outputs.runtime_digest }}
    steps:
      - name: Validate release input
        id: verify-input
        env:
          BUILD_SHA: ${{ inputs.build_sha }}
        run: |
          if [[ ! "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "build_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.verify-input.outputs.build_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit belongs to main
        env:
          BUILD_SHA: ${{ steps.verify-input.outputs.build_sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$BUILD_SHA" origin/main || {
            echo "$BUILD_SHA is not reachable from main" >&2
            exit 1
          }

      - name: Verify successful CI run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BUILD_SHA: ${{ steps.verify-input.outputs.build_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              head_sha: process.env.BUILD_SHA,
              event: "push",
              status: "completed",
              per_page: 100,
            });
            const passed = response.data.workflow_runs.some(
              (run) => run.conclusion === "success" && run.head_branch === "main",
            );
            if (!passed) {
              core.setFailed(`No successful main CI run found for ${process.env.BUILD_SHA}`);
            }

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve immutable runtime image
        id: resolve
        env:
          BUILD_SHA: ${{ steps.verify-input.outputs.build_sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$RUNTIME_IMAGE:$BUILD_SHA" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable runtime image digest for $BUILD_SHA" >&2
            exit 1
          fi
          echo "runtime_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "runtime_ref=$RUNTIME_IMAGE@$digest" >> "$GITHUB_OUTPUT"

  evaluate:
    name: Generate and gate evidence on GPU
    needs: authorize
    runs-on: [self-hosted, raglab-gpu]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      RAGLAB_BUILD_SHA: ${{ needs.authorize.outputs.build_sha }}
      RAGLAB_IMAGE_DIGEST: ${{ needs.authorize.outputs.runtime_digest }}
      RAGLAB_IMAGE: ${{ needs.authorize.outputs.runtime_ref }}
      RELEASE_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/release
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.build_sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run isolated ingestion and evaluation
        env:
          COMPOSE_PROJECT_NAME: raglab-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          install -d -m 0777 "$RELEASE_ARTIFACTS_DIR"
          docker compose -f .github/release/compose.gpu.yaml pull
          docker compose -f .github/release/compose.gpu.yaml up -d --wait postgres ollama
          docker compose -f .github/release/compose.gpu.yaml run --rm ollama-models
          docker compose -f .github/release/compose.gpu.yaml run --rm python-models
          docker compose -f .github/release/compose.gpu.yaml run --rm ingest
          docker compose -f .github/release/compose.gpu.yaml run --rm evaluate
          docker compose -f .github/release/compose.gpu.yaml run --rm gate
          docker compose -f .github/release/compose.gpu.yaml run --rm models-manifest

      - name: Build auditable demo release
        env:
          COMPOSE_PROJECT_NAME: raglab-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker compose -f .github/release/compose.gpu.yaml run --rm --entrypoint raglab-build-demo-release gate \
            --evaluation artifacts/evaluation.json \
            --baseline data/evaluation/baselines/raspberry_pi_demo_v1.json \
            --ingestion-receipt artifacts/ingestion.json \
            --models artifacts/models.json \
            --build-sha "$RAGLAB_BUILD_SHA" \
            --image-digest "$RAGLAB_IMAGE_DIGEST" \
            --workflow-url "$WORKFLOW_URL" \
            --output artifacts/demo-release.json

      - name: Upload verified evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-release-${{ needs.authorize.outputs.build_sha }}
          path: artifacts/release/demo-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove isolated release resources
        if: always()
        env:
          COMPOSE_PROJECT_NAME: raglab-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker compose -f .github/release/compose.gpu.yaml down --volumes --remove-orphans --timeout 30
          rm -rf "$RELEASE_ARTIFACTS_DIR"

  publish-portfolio:
    name: Publish CPU-only portfolio image
    needs: [authorize, evaluate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      portfolio_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.build_sha }}
          persist-credentials: false

      - name: Download verified evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demo-release-${{ needs.authorize.outputs.build_sha }}
          path: .

      - name: Bind portfolio image to evidence bytes
        id: evidence
        run: echo "sha256=$(sha256sum demo-release.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish portfolio image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.portfolio
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.PORTFOLIO_IMAGE }}:${{ needs.authorize.outputs.build_sha }}
          build-args: |
            RAGLAB_BUILD_SHA=${{ needs.authorize.outputs.build_sha }}
            RAGLAB_DEMO_RELEASE_SHA256=${{ steps.evidence.outputs.sha256 }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

      - name: Record immutable portfolio image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "### Portfolio image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$PORTFOLIO_IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Approve and deploy production
    needs: [authorize, publish-portfolio]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.build_sha }}
          persist-credentials: false

      - name: Install pinned SSH host identity
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release definition
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp compose.production.yaml scripts/deploy_portfolio.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo install -m 755 /tmp/deploy_portfolio.sh /srv/raglab/deploy_portfolio.sh"

      - name: Deploy immutable image with rollback
        env:
          BUILD_SHA: ${{ needs.authorize.outputs.build_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PORTFOLIO_DIGEST: ${{ needs.publish-portfolio.outputs.portfolio_digest }}
        run: |
          image="$PORTFOLIO_IMAGE@$PORTFOLIO_DIGEST"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo bash /srv/raglab/deploy_portfolio.sh /tmp/compose.production.yaml '$image' '$BUILD_SHA'"
