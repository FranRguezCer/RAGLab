name: raglab-production

services:
  proxy:
    image: ${TRAEFIK_IMAGE:?set TRAEFIK_IMAGE to an immutable image digest}
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  portfolio:
    image: ${RAGLAB_PORTFOLIO_IMAGE:?set RAGLAB_PORTFOLIO_IMAGE to an immutable image digest}
    environment:
      RAGLAB_BUILD_SHA: ${RAGLAB_BUILD_SHA:?set RAGLAB_BUILD_SHA}
      RAGLAB_DEMO_RELEASE: /app/demo-release.json
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.raglab.rule=Host(`${RAGLAB_DOMAIN:?set RAGLAB_DOMAIN}`)
      - traefik.http.routers.raglab.entrypoints=websecure
      - traefik.http.routers.raglab.tls=true
      - traefik.http.routers.raglab.tls.certresolver=letsencrypt
      - traefik.http.middlewares.raglab-limit.ratelimit.average=20
      - traefik.http.middlewares.raglab-limit.ratelimit.burst=10
      - traefik.http.middlewares.raglab-inflight.inflightreq.amount=20
      - traefik.http.routers.raglab.middlewares=raglab-limit,raglab-inflight
      - traefik.http.services.raglab.loadbalancer.server.port=8000
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  traefik-certificates:
